name: Publish LumaTranslate v1.0.3 public release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.3-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify LumaTranslate 1.0.3
        shell: bash
        env:
          HANDOFF_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4c94-81f4-ad58-f5433ebdb55d/raw?se=2026-10-12T17%3A01%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=e676b314-5684-50f3-a158-13d79d9cf2c6&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T06%3A30%3A59Z&ske=2026-10-13T06%3A30%3A59Z&sks=b&skv=2026-02-06&sig=Xfy9eKbLwxHoP81a5Ofa5coNKmZ5IBJqgyUwVbYLcp8%3D'
          EXPECTED_SHA256: 'f54a4532f7f032704138eac4a5eb002bf7e9f6d76c54b3608c308421ac38431a'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 --max-time 180 --output handoff.zip "$HANDOFF_URL"
          unzip -j -o handoff.zip 'LumaTranslate-Setup.exe' 'LumaTranslate-Setup.exe.sha256'
          printf '%s  LumaTranslate-Setup.exe\n' "$EXPECTED_SHA256" | sha256sum --check --status
          sha256sum --check --status LumaTranslate-Setup.exe.sha256
          test "$(stat -c%s LumaTranslate-Setup.exe)" -gt 10000000
          cat > notes.md <<'NOTES'
          LumaTranslate 1.0.3 — обновление для Windows 10/11.

          Что изменилось:
          - Исправлено ложное предупреждение «Не удалось зарегистрировать горячие клавиши» при обновлении или удалении приложения.
          - При штатном завершении глобальный перехватчик клавиатуры больше не регистрируется повторно.
          - Сохранены горячие клавиши, настройки, интеллектуальное исправление текста и автоматический перезапуск после обновлений.

          Установка: скачайте LumaTranslate-Setup.exe и запустите мастер. Настройки сохраняются.
          Контрольная сумма SHA-256 доступна отдельным файлом.

          При первом обновлении из версии 1.0.2 предупреждение может появиться ещё раз, так как закрывается старая версия приложения. В версии 1.0.3 причина исправлена.

          Установщик не имеет цифровой подписи.
          NOTES
          if gh release view v1.0.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.3 LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v1.0.3 --repo "$GITHUB_REPOSITORY" --notes-file notes.md --title "LumaTranslate Classic v1.0.3" --latest
          else
            gh release create v1.0.3 LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256 --repo "$GITHUB_REPOSITORY" --target main --title "LumaTranslate Classic v1.0.3" --notes-file notes.md --latest
          fi
