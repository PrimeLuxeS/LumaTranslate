name: Publish LumaTranslate v1.0.2 public release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.2-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify LumaTranslate 1.0.2
        shell: bash
        env:
          HANDOFF_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-ddb4-820a-8d61-aecdc034843f/raw?se=2026-10-12T16%3A35%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=7325ac5a-2f74-546d-8f05-1ed8d7d72507&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T04%3A01%3A41Z&ske=2026-10-13T04%3A01%3A41Z&sks=b&skv=2026-02-06&sig=hI9dACmYVOjuJjy93uOR7bgtHfbVFek9x1EyHGlVOjc%3D'
          EXPECTED_SHA256: '5feb3913a6f112c1f57ac57e62d12ad3431b4213f19779c0b1fffc033b1856a9'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 --max-time 180 --output handoff.zip "$HANDOFF_URL"
          unzip -j -o handoff.zip 'LumaTranslate-Setup.exe' 'LumaTranslate-Setup.exe.sha256'
          printf '%s  LumaTranslate-Setup.exe\n' "$EXPECTED_SHA256" | sha256sum --check --status
          sha256sum --check --status LumaTranslate-Setup.exe.sha256
          test "$(stat -c%s LumaTranslate-Setup.exe)" -gt 10000000
          cat > notes.md <<'NOTES'
          LumaTranslate 1.0.2 — обновление для Windows 10 и 11.

          Что изменилось:
          • Окно обновлений теперь показывает обычный текст без технической разметки.
          • Добавлен автоматический перезапуск после успешной установки следующих обновлений.
          • Сохранены настройки, горячие клавиши и привычный интерфейс.

          Чтобы установить обновление, скачайте LumaTranslate-Setup.exe и запустите его.
          Файл LumaTranslate-Setup.exe.sha256 содержит контрольную сумму установщика.

          При первом переходе с 1.0.1 на 1.0.2 может потребоваться один раз открыть программу вручную.
          Установщик пока не подписан цифровой подписью.
          NOTES
          if gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.2 LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v1.0.2 --repo "$GITHUB_REPOSITORY" --notes-file notes.md --title "LumaTranslate Classic v1.0.2" --latest
          else
            gh release create v1.0.2 LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256 --repo "$GITHUB_REPOSITORY" --target main --title "LumaTranslate Classic v1.0.2" --notes-file notes.md --latest
          fi
