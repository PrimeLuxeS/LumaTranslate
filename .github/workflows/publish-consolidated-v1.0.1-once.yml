name: Publish consolidated LumaTranslate v1.0.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-consolidated-v1.0.1-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified setup, replace release notes, remove superseded releases
        shell: bash
        env:
          HANDOFF_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-dfd4-81f4-b3cc-7705551fae1f/raw?se=2026-10-12T17%3A19%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=21e5cc84-066d-50a2-8265-766c7e533bb7&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T06%3A30%3A58Z&ske=2026-10-13T06%3A30%3A58Z&sks=b&skv=2026-02-06&sig=mtMcZrfMqj1Gl/ijBOw3VJABcDsSzBhdN8Di%2BN0IvA4%3D'
          EXPECTED_SHA256: 'a4b3517b5c46695b2ca272d9aca548ea2202e034eaa64a72f3f2963e3c49f70d'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 --max-time 180 --output handoff.zip "$HANDOFF_URL"
          unzip -j -o handoff.zip 'LumaTranslate-Setup.exe' 'LumaTranslate-Setup.exe.sha256'
          printf '%s  LumaTranslate-Setup.exe\n' "$EXPECTED_SHA256" | sha256sum --check
          sha256sum --check LumaTranslate-Setup.exe.sha256
          test "$(stat -c%s LumaTranslate-Setup.exe)" -eq 54871910
          cat > notes.md <<'NOTES'
          Что изменилось:
          
          - Исправлено ложное предупреждение «Не удалось зарегистрировать горячие клавиши» при обновлении или удалении приложения.
          - При штатном завершении глобальный перехватчик клавиатуры больше не регистрируется повторно.
          - Контекстное исправление русских опечаток перед переводом, включая «привит май друк» → «привет мой друг».
          - Улучшенное получение и замена выделенного текста в приложениях Windows, включая Steam.
          - Умное исправление раскладки EN ↔ RU, Rekey и редактируемые глобальные горячие клавиши.
          - Несколько сервисов перевода и распознавание текста с экрана (OCR).
          NOTES
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            replaced=0
            for attempt in 1 2 3; do
              if gh release upload v1.0.1 LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256 --repo "$GITHUB_REPOSITORY" --clobber; then
                replaced=1
                break
              fi
              sleep 8
            done
            if [ "$replaced" -eq 1 ]; then
              gh release edit v1.0.1 --repo "$GITHUB_REPOSITORY" --notes-file notes.md --title "LumaTranslate Classic v1.0.1" --latest
            else
              gh release delete v1.0.1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              gh release create v1.0.1 LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256 --repo "$GITHUB_REPOSITORY" --target main --title "LumaTranslate Classic v1.0.1" --notes-file notes.md --latest
            fi
          else
            gh release create v1.0.1 LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256 --repo "$GITHUB_REPOSITORY" --target main --title "LumaTranslate Classic v1.0.1" --notes-file notes.md --latest
          fi
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.1" --jq '.id')
          test -n "$release_id"
          exe_size=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[] | select(.name == "LumaTranslate-Setup.exe") | .size')
          sha_size=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[] | select(.name == "LumaTranslate-Setup.exe.sha256") | .size')
          test "$exe_size" -eq 54871910
          test "$sha_size" -eq 90
          release_notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.1" --jq '.body')
          test "$release_notes" = "$(cat notes.md)"
          gh release delete v1.0.3 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          gh release delete v1.0.2 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "v1.0.1"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft == false) | .tag_name] | sort | join(",")')" = "v1.0.0,v1.0.1"
