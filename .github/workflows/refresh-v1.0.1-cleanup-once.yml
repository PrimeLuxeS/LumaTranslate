name: Refresh tested LumaTranslate installer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-v1.0.1-cleanup-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify artifact and update v1.0.1
        shell: bash
        env:
          HANDOFF_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-f238-81f4-97a0-4780e69fc578/raw?se=2026-10-12T20%3A06%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=5166e03f-d7dd-5b04-b55c-99d08f5ff884&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T07%3A37%3A48Z&ske=2026-10-13T07%3A37%3A48Z&sks=b&skv=2026-02-06&sig=w25GwY0soPXulHcog%2BkZQjI6ktuKnTpaPL2F3a5fwYk%3D'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --connect-timeout 30 --max-time 480 --output handoff.zip "$HANDOFF_URL"
          printf 'bacea25748f984f5e3d8fc07e0cb95dfbb8446a4cb085c9a7a72fb8013182afb  handoff.zip\n' | sha256sum --check
          test "$(stat -c%s handoff.zip)" -eq 55169026
          unzip -j -o handoff.zip LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256
          sha256sum --check LumaTranslate-Setup.exe.sha256
          test "$(stat -c%s LumaTranslate-Setup.exe.sha256)" -eq 90
          actual=$(sha256sum LumaTranslate-Setup.exe | cut -d' ' -f1)
          size=$(stat -c%s LumaTranslate-Setup.exe)
          test "$size" -gt 50000000
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null
          success=0
          for attempt in 1 2 3; do
            if gh release upload v1.0.1 LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256 --clobber --repo "$GITHUB_REPOSITORY"; then
              success=1
              break
            fi
            sleep 8
          done
          test "$success" -eq 1
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.1" --jq '.id')
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets")
          test "$(jq -r '.[] | select(.name=="LumaTranslate-Setup.exe") | .size' <<<"$assets")" -eq "$size"
          test "$(jq -r '.[] | select(.name=="LumaTranslate-Setup.exe") | .digest' <<<"$assets")" = "sha256:$actual"
          test "$(jq -r '.[] | select(.name=="LumaTranslate-Setup.exe.sha256") | .size' <<<"$assets")" -eq 90
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = v1.0.1
