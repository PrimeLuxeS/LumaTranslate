name: Publish tested LumaTranslate v1.0.1 startup fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-v1.0.1-autostart-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Publish tested private Windows build to public release
        shell: bash
        env:
          HANDOFF_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-e974-8210-ae51-dda6c68e1214/raw?se=2026-10-12T19%3A20%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=5bc81d0c-fa54-5c38-9a5d-4c37c16d3fc3&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T03%3A34%3A40Z&ske=2026-10-13T03%3A34%3A40Z&sks=b&skv=2026-02-06&sig=hfyBvBCe2e1koq/7HDHSndEZPQes0bZUEMX7RYQcwY0%3D'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --connect-timeout 30 --max-time 420 --output handoff.zip "$HANDOFF_URL"
          unzip -j -o handoff.zip LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256
          printf '507ddfd7dfcfa6df39edc7b0bb863c57105973b7acd3810cdea00d6cff72b97e  LumaTranslate-Setup.exe\n' | sha256sum --check
          sha256sum --check LumaTranslate-Setup.exe.sha256
          test "$(stat -c%s LumaTranslate-Setup.exe)" -eq 55150875
          test "$(stat -c%s LumaTranslate-Setup.exe.sha256)" -eq 90
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null
          success=0
          for attempt in 1 2 3; do
            if gh release upload v1.0.1 LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256 --clobber --repo "$GITHUB_REPOSITORY"; then
              success=1
              break
            fi
            sleep 8
          done
          test "$success" -eq 1
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.1" --jq '.id')
          size=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | select(.name=="LumaTranslate-Setup.exe") | .size')
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | select(.name=="LumaTranslate-Setup.exe") | .digest')
          test "$size" -eq 55150875
          test "$digest" = 'sha256:507ddfd7dfcfa6df39edc7b0bb863c57105973b7acd3810cdea00d6cff72b97e'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "v1.0.1"
