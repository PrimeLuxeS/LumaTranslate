name: Publish LumaTranslate public installer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-installer-transfer.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Transfer and verify installer
        shell: bash
        env:
          INSTALLER_URL_B64: ''
          EXPECTED_SHA256: '4735c51a7386b9281263e3527287ef716b0ccecbacaba6a618c65e662b6f67e1'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$INSTALLER_URL_B64" | base64 --decode)"
          curl --fail --location --silent --show-error --retry 2 --output LumaTranslate-Setup.exe "$URL"
          printf '%s  LumaTranslate-Setup.exe\n' "$EXPECTED_SHA256" | sha256sum --check --status
          printf '%s  LumaTranslate-Setup.exe\n' "$EXPECTED_SHA256" > LumaTranslate-Setup.exe.sha256
          cat > notes.md <<'NOTES'
          # LumaTranslate Classic v1.0.0

          Windows 10/11 x64. Download **LumaTranslate-Setup.exe**, run the graphical installer, and optionally create a desktop shortcut.

          ## Русский

          Версия для Windows 10/11 x64. Скачайте **LumaTranslate-Setup.exe** и запустите графический мастер установки. Можно создать ярлык на рабочем столе, а затем удалить приложение через Windows или настройки LumaTranslate.

          The installer is not digitally signed / Установщик не подписан цифровой подписью.
          NOTES
          gh release create v1.0.0 LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256 --repo "$GITHUB_REPOSITORY" --target main --title "LumaTranslate Classic v1.0.0" --notes-file notes.md --latest
