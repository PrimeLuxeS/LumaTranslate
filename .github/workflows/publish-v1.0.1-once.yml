name: Publish LumaTranslate v1.0.1 public release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.1-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download newly built installer artifact and verify
        shell: bash
        env:
          HANDOFF_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-d78c-8243-914c-780ec4c16090/raw?se=2026-10-12T16%3A04%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=c192dbc7-41eb-5509-849a-4f22248970fd&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T06%3A51%3A23Z&ske=2026-10-13T06%3A51%3A23Z&sks=b&skv=2026-02-06&sig=H7rdKzAz%2BdR0aCr6h%2BuW5eF/q/obuwCthz3fsx2KxuI%3D'
          EXPECTED_SHA256: 'e829398daa7475a470bae6bfd8e085bcc047928ae7e49cdffa1f5729f5d9e7ef'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 --max-time 180 --output handoff.zip "$HANDOFF_URL"
          unzip -j -o handoff.zip 'LumaTranslate-Setup.exe' 'LumaTranslate-Setup.exe.sha256'
          printf '%s  LumaTranslate-Setup.exe\n' "$EXPECTED_SHA256" | sha256sum --check --status
          sha256sum --check --status LumaTranslate-Setup.exe.sha256
          test "$(stat -c%s LumaTranslate-Setup.exe)" -gt 10000000
          cat > notes.md <<'NOTES'
          # LumaTranslate Classic 1.0.1
          
          Новая версия бесплатного переводчика для Windows 10/11 (x64).
          
          ## Что нового
          - Контекстное исправление русских опечаток перед переводом, включая «привит май друк» → «привет мой друг».
          - Улучшенное получение и замена выделенного текста в приложениях Windows, включая Steam.
          - Умное исправление раскладки EN ↔ RU, Rekey и редактируемые глобальные горячие клавиши.
          - Несколько сервисов перевода и распознавание текста с экрана (OCR).
          
          **Установка:** скачайте LumaTranslate-Setup.exe и запустите мастер установки.
          Контрольная сумма SHA-256 приложена отдельным файлом.
          
          Установщик не подписан цифровой подписью, поэтому Windows SmartScreen может показать предупреждение.
          NOTES
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.1 LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v1.0.1 --repo "$GITHUB_REPOSITORY" --notes-file notes.md --title "LumaTranslate Classic v1.0.1" --latest
          else
            gh release create v1.0.1 LumaTranslate-Setup.exe LumaTranslate-Setup.exe.sha256 --repo "$GITHUB_REPOSITORY" --target main --title "LumaTranslate Classic v1.0.1" --notes-file notes.md --latest
          fi
